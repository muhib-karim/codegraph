[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph"
version = "1.1.0"
description = "Code graph queries with file:line evidence, a local explorer, and MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.26.0,<0.27",
  "tree-sitter-python>=0.25.0,<0.26",
  "tree-sitter-java>=0.23.5,<0.24",
  "tree-sitter-typescript>=0.23.2,<0.24",
  "ladybug>=0.20,<0.21",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
browser = ["playwright>=1.64.0,<2"]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.1", "mypy>=2.4.0", "coverage>=7.16.2"]

[project.scripts]
codegraph = "codegraph.cli:main"

[tool.setuptools.packages.find]
include = ["codegraph*"]

[tool.setuptools.package-data]
codegraph = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["codegraph", "bench", "scripts"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["ladybug.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=codegraph --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
source = ["codegraph"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
