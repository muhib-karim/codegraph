name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Only runs for the same pull request share a group, so a new push to a PR cancels the
# run it supersedes. Push runs get a unique group and are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: make install
      - run: make check
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make install
      - run: make eval-drift
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-evaluation
          path: eval/reports/
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Index and query pinned public repositories
        run: python bench/run.py --out bench-out
      - run: cat bench-out/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: bench-out/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t codegraph:1.1.0 .
      - name: Non-root index and query smoke test
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests/fixtures/mini:/fixture:ro" codegraph:1.1.0 -ec '
            test "$(id -u)" != 0
            cp -r /fixture /tmp/repo
            codegraph index /tmp/repo
            codegraph callers make --repo /tmp/repo --json > /tmp/result.json
            python -c "import json; r=json.load(open(\"/tmp/result.json\")); assert [x[\"citation\"] for x in r[\"results\"]] == [\"app.py:6\", \"app.py:10\"]"
            python -c "from codegraph.mcp_server import create_server; s=create_server(\"/tmp/repo/.codegraph/graph.lbug\"); assert s.name == \"codegraph\""
          '
