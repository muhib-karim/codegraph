<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>codegraph · explorer</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header class="top"><div class="brand"><span class="brandmark">◇</span><span>codegraph</span><small>EXPLORER</small></div><div id="status" class="status" role="status">Reading graph…</div></header>
<div id="snapshot-notice" class="snapshot-notice" role="status" hidden></div><div class="shell"><aside class="sidebar"><div class="side-head"><h2>Repository</h2><span id="file-count"></span></div><label class="search-label" for="search">Find a symbol</label><input id="search" type="search" placeholder="Name or qualified name" autocomplete="off"><div id="search-results" class="search-results" role="status" aria-live="polite" hidden></div><div class="side-subhead">FILES <span id="coverage"></span></div><nav id="files" aria-label="Repository files"></nav><button id="more-files" class="more" hidden>Load more files</button></aside>
<main id="main"><div class="empty"><div class="empty-icon">◇</div><h1>Explore the code graph</h1><p>Choose a file or search for a symbol to inspect definitions, relationships and impact.</p></div></main>
<aside class="right"><div class="right-head">ANALYZE</div><div class="tabs" role="tablist" aria-label="Graph queries"><button role="tab" aria-selected="true" tabindex="0" data-command="callers" class="active">Callers</button><button role="tab" aria-selected="false" tabindex="-1" data-command="inherits">Inherits</button><button role="tab" aria-selected="false" tabindex="-1" data-command="dead-code">Dead code</button><button role="tab" aria-selected="false" tabindex="-1" data-command="blast">Blast</button></div><form id="query-form"><label for="target">Symbol or file</label><input id="target" placeholder="Select a symbol" autocomplete="off"><label for="depth">Depth</label><select id="depth"><option value="1">1 hop</option><option value="2">2 hops</option><option value="3">3 hops</option></select><button class="primary" type="submit">Run query <span>↗</span></button></form><div id="query-extra" class="query-extra" hidden><label class="check"><input id="ancestors" type="checkbox"> Ancestors</label><label for="kind">Kind filter</label><input id="kind" placeholder="method, function…"><label for="confidence">Dead-code confidence</label><select id="confidence"><option value="all">All candidates</option><option value="likely">Likely</option><option value="possible">Possible</option></select><label for="scope">Path scope</label><input id="scope" placeholder="e.g. pkg/"></div><div id="query-results" class="query-results" role="status" aria-live="polite"><p class="muted">Select a symbol to see its callers.</p></div><button id="more-results" class="more" hidden>More results</button></aside></div>
<section id="coverage-panel" class="coverage-panel" aria-label="Index coverage" hidden></section><div id="source-modal" class="modal" hidden><div class="modal-backdrop" data-close="true"></div><section class="source-card" role="dialog" aria-modal="true" aria-label="Source preview"><div class="source-head"><strong id="source-name"></strong><button id="source-close" aria-label="Close source preview">×</button></div><pre id="source-content"></pre></section></div>
</body></html>
